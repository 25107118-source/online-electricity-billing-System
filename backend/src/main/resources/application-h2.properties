# ==============================================================================
# H2 In-Memory Database Profile for Localhost Demo (Zero MySQL Setup Required!)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Or: mvn spring-boot:run -Dspring.profiles.active=h2
# ==============================================================================

server.port=8080
server.servlet.context-path=/

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:electricity_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
app.jwt.secret=9a6747f3a18cd7f15222e1f305b2a84f52e51a74d6f2930c12e847b01d364144
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
