# ==============================================================================
# Online Electricity Billing System - Spring Boot Configuration
# ==============================================================================

server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
# Change 'root' and your password according to your local MySQL installation:
spring.datasource.url=jdbc:mysql://localhost:3306/electricity_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=9a6747f3a18cd7f15222e1f305b2a84f52e51a74d6f2930c12e847b01d364144
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.electricity.billing=DEBUG
